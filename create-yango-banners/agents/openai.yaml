interface:
  display_name: "Yango Creative Machine"
  short_description: "Create Yango creatives exclusively through MCP"
  default_prompt: "Use $create-yango-banners to set up MCP and create creatives; if the token is missing, create a personal token file and give its link before waiting."
dependencies:
  tools:
    - type: "mcp"
      value: "yango-creative-machine"
      description: "Create and revise images, banners, videos, and creative experiments"
      transport: "streamable_http"
      url: "https://creativemachiemcp-production.up.railway.app/mcp"
policy:
  allow_implicit_invocation: true
